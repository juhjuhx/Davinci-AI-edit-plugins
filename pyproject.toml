[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smart-aroll"
version = "4.0.0"
description = "AI-powered A-roll video editing tool for DaVinci Resolve"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["video-editing", "whisper", "davinci-resolve", "ai", "a-roll"]
authors = [
    {name = "juhjuhx", email = ""},
]

dependencies = [
    "faster-whisper>=1.0.0",
    "flask>=3.0.0",
    "edge-tts>=6.1.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["core*", "api*", "workers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.ruff.format]
quote-style = "double"
